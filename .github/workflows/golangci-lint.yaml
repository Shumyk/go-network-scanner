name: GoLang Lint
on:
  # push:
    # branches:
      # - master
      # - main
  pull_request:


jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: GoLang Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
