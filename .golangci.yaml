run:
  timeout: 2m
  tests: false

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true
    # ignore: "fmt:.,io/ioutil:^Read.,pp:.*"
  goconst:
    min-len: 3
    min-occurrences: 4
  gocritic:
    enabled-tags:
      - style
      - diagnostic
      - performance
      - experimental
      - opinionated
    disabled-checks:
      - wrapperFunc
      - regexpMust
    settings:
      captLocal:
        paramsOnly: true
      rangeValCopy:
        sizeThreshold: 32
  gocyclo:
    min-complexity: 20
  gosimple:
    checks: ["all"]
  govet:
    enable-all: true
    settings:
      shadow:
        strict: true
  nakedret:
    max-func-lines: 50
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
  predeclared:
    q: true
  revive:
    max-open-files: 4096
    enable-all-rules: true
  staticcheck:
    checks: ["all"]
issues:
  fix: true
  exclude-use-default: false
  exclude:
    # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
    - Error return value of .((os.)?std(out|err)..*|.*Close|.Flush|pp.|os.Remove(All)?|.*printf?|os.(Un)?Setenv). is not checked
    # golint: False positive when tests are defined in package 'test'
    - func name will be used as test.Test.* by other packages, and that stutters; consider calling this
    # staticcheck: Developers tend to write in C-style with an explicit 'break' in a 'switch', so it's ok to ignore
    - ineffective break statement. Did you mean to break out of the outer loop
    # gosec: Too many false-positives for parametrized shell calls
    - Subprocess launch(ed with variable|ing should be audited)
    # gosec: Duplicated errcheck checks
    - G104
    # gofmt throws bullshit here, ignore it
    - File is not gofmt-ed with -s
    # gosec: Too many issues in popular repos
    - (Expect directory permissions to be 0750 or less|Expect file permissions to be 0600 or less)
    # gosec: False positive is triggered by 'src, err := ioutil.ReadFile(filename)'
    - Potential file inclusion via variable
    # nlreturn: don't space continue cuddling
    - (continue|return) with no blank line before
  exclude-files:
    - ".generated_.types\\.go$"

linters:
  disable-all: true
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exportloopref
    - forbidigo
    - forcetypeassert
    # - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - gocyclo
    - godot
    - err113
    - gofumpt
    - gosec
    - gosimple
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - interfacebloat
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilnil
    - nlreturn
    - nosprintfhostport
    - noctx
    - prealloc
    - predeclared
    - perfsprint
    - revive
    - staticcheck
    - tagliatelle
    - typecheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - wrapcheck
    - testifylint
